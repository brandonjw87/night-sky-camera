plugins {
    id 'com.android.application'
}

android {
    namespace 'com.brandon.nightsky'
    compileSdk 37

    defaultConfig {
        applicationId 'com.brandon.nightsky'
        minSdk 37
        targetSdk 37
        versionCode 21
        versionName '3.2'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// No dependencies: the app uses only the Android platform APIs.
