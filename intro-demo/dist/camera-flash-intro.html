<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Camera Flash Intro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: the intro fills the frame edge to edge like a viewfinder; a camera-style shooting bar
   (slow-mo, shutter, sound) floats over its bottom edge and steps aside while the intro plays. */
:root {
  color-scheme: dark;
  --night: #04060c;                 /* the sky's darkest navy, page ground */
  --scrim: rgba(3, 5, 10, 0.93);    /* behind the shooting bar */
  --scrim-clear: rgba(3, 5, 10, 0);
  --glass: rgba(16, 21, 35, 0.70);  /* small round buttons */
  --line: rgba(190, 204, 232, 0.24);
  --ink: #eaeef7;                   /* moonlit white */
  --muted: #a4aec4;
  --gold: #e6c58a;                  /* champagne gold of the letter bevels */
  --gold-hi: #f8e6bd;
  --gold-lo: #a7814a;
  --gold-ink: #1a1205;
  --focus: #a6efbc;                 /* autofocus-lock green, focus rings only */
  --warn: #ffc2b3;
  --font-ui: "Barlow Semi Condensed", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-data: "DM Mono", ui-monospace, "Roboto Mono", Menlo, monospace;
}
/* the night look: Night Sky's red-on-black night-vision palette, so nothing on screen spoils dark eyes */
:root[data-look="night"] {
  --night: #000000;
  --scrim: rgba(0, 0, 0, 0.93);
  --scrim-clear: rgba(0, 0, 0, 0);
  --glass: rgba(42, 8, 7, 0.72);
  --line: rgba(154, 42, 37, 0.55);
  --ink: #e53935;
  --muted: #b03a33;
  --gold: #e53935;
  --gold-hi: #f0584d;
  --gold-lo: #9a2a25;
  --gold-ink: #2a0807;
  --focus: #e53935;
  --warn: #e53935;
}
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; background: var(--night); color: var(--ink);
  font: 500 1rem/1.35 var(--font-ui); -webkit-tap-highlight-color: transparent;
}
#intro { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; cursor: pointer; }

.bar {
  position: fixed; left: 0; right: 0; bottom: 0;
  padding: 2.75rem 16px calc(1rem + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(to top, var(--scrim) 0%, var(--scrim) 45%, var(--scrim-clear) 100%);
  display: grid; justify-items: center; gap: 0.7rem;
  transition: opacity 0.22s ease, transform 0.22s ease;
}
.bar.away { opacity: 0; transform: translateY(0.75rem); pointer-events: none; }

.hint { margin: 0; font-size: 0.875rem; letter-spacing: 0.02em; color: var(--muted); text-align: center; text-wrap: balance; }
.when-landscape { display: none; }
@media (orientation: landscape) { .when-portrait { display: none; } .when-landscape { display: inline; } }

.scrubrow {
  width: min(100%, 30rem); display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 0.75rem;
  font: 400 0.8125rem/1 var(--font-data); font-variant-numeric: tabular-nums; color: var(--muted);
}
#time { color: var(--ink); min-width: 6ch; }
#scrub { -webkit-appearance: none; appearance: none; width: 100%; height: 2rem; margin: 0; background: transparent; cursor: pointer; --fill: 0%; }
#scrub::-webkit-slider-runnable-track { height: 2px; border-radius: 1px; background: linear-gradient(to right, var(--gold) var(--fill), var(--line) var(--fill)); }
#scrub::-webkit-slider-thumb { -webkit-appearance: none; width: 1.125rem; height: 1.125rem; margin-top: calc(1px - 0.5625rem); border-radius: 50%; border: 2px solid var(--night); background: var(--gold); }
#scrub::-moz-range-track { height: 2px; background: var(--line); }
#scrub::-moz-range-progress { height: 2px; background: var(--gold); }
#scrub::-moz-range-thumb { width: 0.875rem; height: 0.875rem; border-radius: 50%; border: 2px solid var(--night); background: var(--gold); }

.controls { display: flex; align-items: flex-start; justify-content: center; gap: 2.25rem; }

.looks { display: flex; gap: 0.25rem; padding: 0.1875rem; border: 1px solid var(--line); border-radius: 999px; background: var(--glass); }
.look {
  min-height: 2rem; padding: 0 1rem; border: 0; border-radius: 999px; background: transparent; color: var(--muted);
  font: 600 0.75rem/1 var(--font-ui); letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer;
  transition: background-color 0.2s ease, color 0.2s ease;
}
.look[aria-checked="true"] { background: var(--gold); color: var(--gold-ink); }
.hint, .scrubrow, #time, .ctl-label, .round, .shutter, .shutter-label { transition: color 0.25s ease, border-color 0.25s ease, background-color 0.25s ease; }
.ctl { display: grid; justify-items: center; gap: 0.4rem; }
.ctl-label { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.round {
  width: 3rem; height: 3rem; margin-top: 0.875rem; padding: 0; border-radius: 50%; border: 1px solid var(--line);
  background: var(--glass); color: var(--ink); display: grid; place-items: center; cursor: pointer;
  font: 500 0.75rem/1 var(--font-data);
}
.round[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
.round[disabled] { opacity: 0.45; cursor: default; }
.shutter {
  width: 4.75rem; height: 4.75rem; padding: 4px; border-radius: 50%; border: 3px solid var(--gold);
  background: transparent; cursor: pointer; display: grid;
}
.shutter .disc {
  border-radius: 50%; display: grid; place-items: center; color: var(--gold-ink);
  background: radial-gradient(circle at 34% 28%, var(--gold-hi), var(--gold) 46%, var(--gold-lo) 100%);
  transition: transform 0.12s ease;
}
.shutter:active .disc { transform: scale(0.93); }
.shutter[disabled] { cursor: progress; }
.shutter[disabled] .disc { background: transparent; border: 2px solid var(--line); border-top-color: var(--gold); animation: spin 0.9s linear infinite; }
.shutter[disabled] svg { display: none; }
.shutter-label { color: var(--gold); }
@keyframes spin { to { transform: rotate(1turn); } }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

.notice {
  position: fixed; left: 16px; right: 16px; top: calc(1.25rem + env(safe-area-inset-top, 0px)); margin: 0 auto; max-width: 28rem;
  padding: 0.875rem 1rem; border: 1px solid var(--line); border-radius: 0.75rem; background: var(--glass);
  color: var(--ink); font-size: 0.9375rem; line-height: 1.4;
}
.notice strong { color: var(--warn); font-weight: 600; }
.notice details { margin-top: 0.5rem; color: var(--muted); font: 400 0.75rem/1.4 var(--font-data); }
.notice pre { margin: 0.4rem 0 0; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 9rem; overflow: auto; }

/* phone on its side: one compact row so the bar stays clear of the one-line name */
@media (orientation: landscape) and (max-height: 34rem) {
  .bar {
    grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "hint hint hint" "looks scrub controls";
    align-items: center; column-gap: 1.5rem; row-gap: 0.25rem; padding-top: 1.75rem;
    padding-left: calc(16px + env(safe-area-inset-left, 0px)); padding-right: calc(16px + env(safe-area-inset-right, 0px));
  }
  .hint { grid-area: hint; justify-self: center; font-size: 0.8125rem; }
  .scrubrow { grid-area: scrub; justify-self: center; }
  .looks { grid-area: looks; }
  .controls { grid-area: controls; gap: 1.25rem; align-items: center; }
  .ctl-label { display: none; }
  .round { margin-top: 0; width: 2.75rem; height: 2.75rem; }
  .shutter { width: 3.75rem; height: 3.75rem; }
}
@media (prefers-reduced-motion: reduce) {
  .bar, .shutter .disc, .look, .hint, .scrubrow, #time, .ctl-label, .round, .shutter, .shutter-label { transition: none; }
  .shutter[disabled] .disc { animation: none; }
}
</style>

<canvas id="intro" role="img" aria-label="Camera flash intro that reads: Made by: Brandon J. Wallace"></canvas>

<div class="bar" id="bar">
  <p class="hint" id="hint">
    <span class="when-portrait">Turn your phone sideways to see the one-line layout.</span>
    <span class="when-landscape">Turn your phone upright to see the two-line layout.</span>
  </p>
  <div class="looks" role="radiogroup" aria-label="Look">
    <button class="look" id="look-standard" type="button" role="radio" aria-checked="true">Standard</button>
    <button class="look" id="look-night" type="button" role="radio" aria-checked="false">Night</button>
  </div>
  <div class="scrubrow">
    <output id="time" for="scrub">2.20 s</output>
    <input id="scrub" type="range" min="0" max="2200" step="1" value="2200" aria-label="Frame time">
    <span>2.20 s</span>
  </div>
  <div class="controls">
    <div class="ctl">
      <button class="round" id="slow" type="button" aria-pressed="false" aria-label="Slow motion, quarter speed">0.25×</button>
      <span class="ctl-label">Slow-mo</span>
    </div>
    <div class="ctl">
      <button class="shutter" id="shutter" type="button" aria-label="Play intro" disabled>
        <span class="disc">
          <svg id="icon-play" viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path d="M8.5 5.6v12.8L18.6 12z" fill="currentColor"/></svg>
          <svg id="icon-replay" viewBox="0 0 24 24" width="28" height="28" aria-hidden="true" hidden><path d="M12.2 5.2a6.9 6.9 0 1 1-6.5 4.6" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/><path d="M4.6 4.4v5.6h5.6" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
      </button>
      <span class="ctl-label shutter-label" id="shutter-label">Loading</span>
    </div>
    <div class="ctl">
      <button class="round" id="sound" type="button" aria-pressed="true" aria-label="Sound">
        <svg id="icon-sound-on" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 9.2h3.6L12.4 5v14l-4.8-4.2H4z" fill="currentColor"/><path d="M15.6 8.6a5 5 0 0 1 0 6.8M18.2 6a8.6 8.6 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <svg id="icon-sound-off" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" hidden><path d="M4 9.2h3.6L12.4 5v14l-4.8-4.2H4z" fill="currentColor"/><path d="M15.8 9.4l5 5.2M20.8 9.4l-5 5.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <span class="ctl-label" id="sound-label">Sound on</span>
    </div>
  </div>
</div>

<div class="notice" id="notice" hidden></div>

<script>
(() => {
"use strict";
const SHADERS = {"common.glsl": "// ---------------------------------------------------------------------------------------------\n// Flash intro \u2014 shared header (GLSL ES 3.00). Same file on the web demo and in the Android app.\n// Everything that moves is a pure function of uTime, so every pass agrees on the timeline.\n// ---------------------------------------------------------------------------------------------\nuniform float uTime;        // seconds since the intro started (0 .. T_END)\nuniform vec2  uRes;         // size of the target this pass draws into (px)\nuniform vec2  uScreen;      // size of the final screen (px)\nuniform vec4  uNameRect;    // name SDF texture rectangle in object space (em): x0, y0, w, h\nuniform vec2  uNameInk;     // ink size of the name (em)\nuniform float uNameSpread;  // em per unit of stored SDF value\nuniform float uNameEps;     // normal sampling step (em)\nuniform vec4  uMadeUV;      // label atlas uv rect of \"MADE BY:\"\nuniform vec2  uMadeSize;    // its rect size (label em)\nuniform vec4  uHudUV;       // label atlas uv rect of the viewfinder readout\nuniform vec2  uHudSize;     // its rect size (label em)\nuniform float uLabelSpread; // label em per unit of (stored - 0.5) * 2\nuniform float uLandscape;   // 0 portrait (two lines), 1 landscape (one line)\nuniform float uNight;       // 0 the standard look, 1 the red night look (values between crossfade)\n\n#define T_END      2.2\n#define PI         3.14159265\n#define HALF_DEPTH 0.118     // half thickness of the 3D letters (em)\n#define BEVEL      0.056     // 45 degree chamfer on the letter edges (em)\n#define HERO_T     0.640     // the big on-camera flash\n\nfloat sat(float x) { return clamp(x, 0.0, 1.0); }\nfloat easeOutCubic(float x) { x = sat(x); float y = 1.0 - x; return 1.0 - y * y * y; }\nfloat easeOutQuart(float x) { x = sat(x); float y = 1.0 - x; return 1.0 - y * y * y * y; }\nfloat easeInOutCubic(float x) { x = sat(x); return x < 0.5 ? 4.0 * x * x * x : 1.0 - pow(-2.0 * x + 2.0, 3.0) * 0.5; }\nfloat easeInOutSine(float x) { x = sat(x); return 0.5 - 0.5 * cos(PI * x); }\n\n// fast linear attack, exponential decay\nfloat pulse(float t, float t0, float a, float d) {\n    float x = t - t0;\n    if (x < 0.0) return 0.0;\n    return x < a ? x / a : exp(-(x - a) / d);\n}\n\n// ---- paparazzi bursts before the hero flash: (time, peak) and position --------------------------\nconst vec2 FLT[4] = vec2[4](vec2(0.340, 1.00), vec2(0.430, 0.85), vec2(0.505, 0.95), vec2(0.565, 0.80));\n// x, y in units of the name's half ink size, z in em in front of the letters\nconst vec3 FLP[4] = vec3[4](vec3(-0.80, 2.70, 2.4), vec3(0.93, -1.20, 2.0), vec3(-0.55, -3.10, 2.6), vec3(0.60, 3.00, 2.2));\n\nfloat flashI(int i, float t) { return FLT[i].y * pulse(t, FLT[i].x, 0.010, 0.046); }\nvec3 flashPos(int i) {\n    vec3 f = FLP[i];\n    float hy = mix(uNameInk.y * 0.5, 0.75, uLandscape);\n    return vec3(f.x * uNameInk.x * 0.5, f.y * hy + 0.1, f.z);\n}\nfloat heroI(float t) { return pulse(t, HERO_T, 0.014, 0.085) + 0.22 * pulse(t, HERO_T, 0.014, 0.42); }\nfloat papSum(float t) { return flashI(0, t) + flashI(1, t) + flashI(2, t) + flashI(3, t); }\n\n// ---- labels placement (object space, name em) --------------------------------------------------\nfloat labelScale() { return mix(0.33, 0.30, uLandscape); }\nfloat madeCenterY() { return uNameInk.y * 0.5 + mix(0.36, 0.30, uLandscape) + 0.35 * labelScale(); }\n\n// ---- camera ------------------------------------------------------------------------------------\nmat3 rotY(float a) { float c = cos(a), s = sin(a); return mat3(c, 0.0, -s, 0.0, 1.0, 0.0, s, 0.0, c); }\nmat3 rotX(float a) { float c = cos(a), s = sin(a); return mat3(1.0, 0.0, 0.0, 0.0, c, s, 0.0, -s, c); }\n\nfloat camK() { return 1.9; }\nfloat camTanX() { return 0.5 / (mix(0.86, 0.78, uLandscape) * camK()); }\nfloat camTanY() { return camTanX() * uScreen.y / uScreen.x; }\nfloat lensShift() { return mix(0.075, 0.03, uLandscape); }   // ndc: block sits a little above centre\nfloat camShake(float t) { return step(HERO_T, t) * exp(-max(t - HERO_T, 0.0) / 0.085); }\n\n// world: y up, camera on +z looking at -z, letters face +z. Object rotation R (world = R * obj).\nvoid camera(float t, out vec3 ro, out mat3 R) {\n    float e = easeOutCubic(t / T_END);\n    float D = camK() * uNameInk.x * mix(1.10, 0.985, e);\n    float sh = camShake(t);\n    vec2 shake = 0.032 * sh * vec2(sin(t * 173.0), cos(t * 131.0)) * vec2(1.0, 0.7);\n    ro = vec3(shake, D);\n    float yaw = radians(mix(-15.0, 5.0, e)) + radians(1.6) * sh;\n    float pitch = radians(mix(7.0, 1.5, e)) - radians(0.6) * sh;\n    R = rotY(yaw) * rotX(pitch);\n}\n\nvec3 cameraRay(vec2 ndc) {\n    return normalize(vec3(ndc.x * camTanX(), (ndc.y - lensShift()) * camTanY(), -1.0));\n}\n\n// world point -> screen pixel (of the final screen)\nvec2 projectPx(vec3 pw, vec3 ro) {\n    vec3 pc = pw - ro;\n    float iz = 1.0 / max(-pc.z, 1e-3);\n    vec2 ndc = vec2(pc.x * iz / camTanX(), pc.y * iz / camTanY() + lensShift());\n    return (ndc * 0.5 + 0.5) * uScreen;\n}\n\n// ---- hashes / noise ----------------------------------------------------------------------------\nfloat hash12(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }\nvec3 hash32(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973)); p3 += dot(p3, p3.yxz + 33.33); return fract((p3.xxy + p3.yzz) * p3.zyx); }\nfloat vnoise(vec2 p) {\n    vec2 i = floor(p), f = fract(p);\n    vec2 u = f * f * (3.0 - 2.0 * f);\n    float a = hash12(i), b = hash12(i + vec2(1.0, 0.0)), c = hash12(i + vec2(0.0, 1.0)), d = hash12(i + vec2(1.0, 1.0));\n    return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);\n}\nfloat fbm(vec2 p) {\n    float s = 0.0, a = 0.5;\n    mat2 m = mat2(1.6, 1.2, -1.2, 1.6);\n    for (int i = 0; i < 5; i++) { s += a * vnoise(p); p = m * p; a *= 0.5; }\n    return s;\n}\n", "fullscreen.vert": "// Full-screen triangle, no  rough * rough;\n    return D_GGX(NoH, a) * V_Smith(NoV, NoL, a) * F_Schlick(f0, VoH) * NoL;\n}\n\nconst vec3 KEY_DIR = normalize(vec3(-0.45, 0.62, 0.64));   // moonlight, upper left, from the front\nconst vec3 RIM_DIR = normalize(vec3(0.25, 0.80, -0.55));   // cool rim from behind and above\n\nfloat keyLevel(float t) { return mix(0.80, 1.18, smoothstep(0.55, 1.10, t)); }\n\n// studio-at-night environment for reflections (world direction)\nvec3 envMap(vec3 r, float rough, float t) {\n    float y = r.y;\n    vec3 c = mix(vec3(0.010, 0.012, 0.022), vec3(0.050, 0.062, 0.105), smoothstep(-0.25, 0.85, y));\n    float w = 0.05 + rough * 0.35;\n    c += vec3(0.85, 0.92, 1.00) * 1.10 * exp(-pow((y - 0.10) / w, 2.0));\n    c += vec3(1.00, 0.62, 0.38) * 0.32 * exp(-pow((y + 0.30) / (w * 1.8), 2.0));\n    vec3 kd = normalize(vec3(-0.35, 0.45, 0.82));\n    c += vec3(0.75, 0.82, 1.00) * 0.9 * pow(sat(dot(r, kd)), mix(60.0, 6.0, rough));\n    // the light bar that sweeps across the letters after the flash\n    float az = atan(r.x, r.z);\n    float sp = mix(-0.95, 0.95, easeInOutCubic((t - 1.12) / 0.55));\n    float on = smoothstep(1.08, 1.22, t) * (1.0 - smoothstep(1.60, 1.76, t));\n    float sweep = exp(-pow((az - sp) / (0.05 + rough * 0.25), 2.0)) * on;\n    c += vec3(1.00, 0.96, 0.90) * 3.6 * sweep * smoothstep(-0.7, -0.1, y) * (1.0 - smoothstep(0.45, 0.9, y));\n    return c;\n}\n\nstruct Shade { vec3 diff; vec3 coat; vec3 bev; vec3 side; };\n\nvoid addLight(inout Shade s, vec3 n, vec3 v, vec3 l, vec3 lc, vec3 albedo, vec3 bevF0, vec3 sideF0) {\n    float NoL = sat(dot(n, l));\n    s.diff += albedo * lc * NoL;\n    s.coat += specGGX(n, v, l, vec3(0.045), 0.20) * lc;\n    s.bev  += specGGX(n, v, l, bevF0, 0.13) * lc;\n    s.side += (specGGX(n, v, l, sideF0, 0.32) + sideF0 * 0.10 * NoL) * lc;\n}\n\nvec3 shadeName(vec3 p, vec3 nO, vec3 vO, mat3 R, vec3 ro, float t) {\n    vec3 n = R * nO, v = R * vO, pw = R * p;\n    float nz = nO.z;\n    float wFace = smoothstep(0.88, 0.985, nz);\n    float wSide = 1.0 - smoothstep(0.22, 0.48, nz);\n    float wBev = sat(1.0 - wFace - wSide);\n\n    float gy = sat(p.y / max(uNameInk.y, 0.5) + 0.5);\n    vec3 albedo = vec3(0.86, 0.87, 0.90) * mix(vec3(1.0, 0.965, 0.93), vec3(0.965, 0.985, 1.0), gy);\n    vec3 bevF0 = vec3(1.00, 0.79, 0.47);         // champagne gold chamfer\n    vec3 sideF0 = vec3(0.40, 0.42, 0.48);        // dark steel walls\n\n    Shade s = Shade(vec3(0.0), vec3(0.0), vec3(0.0), vec3(0.0));\n    vec3 amb = mix(vec3(0.020, 0.017, 0.020), vec3(0.060, 0.075, 0.120), n.y * 0.5 + 0.5);\n    s.diff = albedo * amb;\n    float kl = keyLevel(t);\n    addLight(s, n, v, KEY_DIR, vec3(0.70, 0.78, 1.00) * 1.15 * kl, albedo, bevF0, sideF0);\n    addLight(s, n, v, RIM_DIR, vec3(0.40, 0.55, 1.00) * 0.9, albedo * 0.2, bevF0, sideF0);\n\n    // paparazzi bursts: point lights in front of the letters\n    for (int i = 0; i < 4; i++) {\n        float I = flashI(i, t);\n        if (I < 0.002) continue;\n        vec3 ld = flashPos(i) - pw;\n        float d2 = dot(ld, ld);\n        addLight(s, n, v, ld * inversesqrt(d2), vec3(1.0, 0.975, 0.95) * I * 7.5 * 9.0 / (9.0 + d2), albedo, bevF0, sideF0);\n    }\n    // hero flash, mounted just above the lens\n    float H = heroI(t);\n    if (H > 0.002) {\n        vec3 l = normalize(ro + vec3(0.0, 0.9, 0.0) - pw);\n        addLight(s, n, v, l, vec3(1.0, 0.98, 0.96) * H * 4.6, albedo, bevF0, sideF0);\n    }\n\n    float NoV = max(dot(n, v), 1e-3);\n    vec3 r = reflect(-v, n);\n    vec3 face = s.diff + s.coat + F_Schlick(vec3(0.045), NoV) * envMap(r, 0.2, t);\n    vec3 bev = s.bev + F_Schlick(bevF0, NoV) * envMap(r, 0.13, t);\n    float depthK = mix(0.30, 1.0, sat((p.z + HALF_DEPTH) / (2.0 * HALF_DEPTH)));\n    vec3 side = (s.side + F_Schlick(sideF0, NoV) * envMap(r, 0.32, t)) * depthK;\n    float sx = mix(-0.62, 0.62, easeInOutSine((t - 1.10) / 0.58)) * uNameInk.x - 0.45 * p.y;\n    float on = smoothstep(1.08, 1.18, t) * (1.0 - smoothstep(1.60, 1.72, t));\n    float bar = exp(-pow((p.x - sx) / 0.32, 2.0)) * on;\n    float core = exp(-pow((p.x - sx) / 0.07, 2.0)) * on;\n    face += vec3(1.00, 0.97, 0.92) * (0.55 * bar + 0.60 * core);\n    bev += bevF0 * (2.2 * bar + 3.0 * core);\n    return face * wFace + bev * wBev + side * wSide;\n}\n\n// raymarch the extruded name; returns premultiplied colour + coverage\nvec4 renderName(vec3 ro, vec3 rd, mat3 R, float t, float pixAng) {\n    mat3 Rt = transpose(R);\n    vec3 o = Rt * ro, d = Rt * rd;\n    vec3 bmin = vec3(uNameRect.xy, -HALF_DEPTH), bmax = vec3(uNameRect.xy + uNameRect.zw, HALF_DEPTH);\n    vec3 inv = 1.0 / d;\n    vec3 t0 = (bmin - o) * inv, t1 = (bmax - o) * inv;\n    vec3 tmn = min(t0, t1), tmx = max(t0, t1);\n    float tn = max(max(tmn.x, tmn.y), tmn.z), tf = min(min(tmx.x, tmx.y), tmx.z);\n    if (tn > tf || tf < 0.0) return vec4(0.0);\n    float tt = max(tn, 0.0) + 1e-4;\n    float bestR = 1e9, bestT = tt;\n    bool hit = false;\n    for (int i = 0; i < 72; i++) {\n        vec3 p = o + d * tt;\n        float s = sdName(p);\n        float fp = tt * pixAng;\n        float ratio = s / fp;\n        if (ratio < bestR) { bestR = ratio; bestT = tt; }\n        if (s < fp * 0.08) { hit = true; bestT = tt; break; }\n        tt += s * 0.92;\n        if (tt > tf) break;\n    }\n    float cov = hit ? 1.0 : sat(0.5 - bestR);\n    if (cov <= 0.0) return vec4(0.0);\n    vec3 p = o + d * bestT;\n    vec3 n = nameNormal(p);\n    vec3 col = shadeName(p, n, -d, R, ro, t);\n    return vec4(col * cov, cov);\n}\n\n// \"MADE BY:\" \u2014 a flat engraved plate in the plane of the letter fronts\nvec4 renderMadeBy(vec3 ro, vec3 rd, mat3 R, float t, out float shadow) {\n    mat3 Rt = transpose(R);\n    vec3 o = Rt * ro, d = Rt * rd;\n    float tt = (HALF_DEPTH - o.z) / d.z;\n    vec3 p = o + d * tt;\n    float ls = labelScale();\n    vec2 size = uMadeSize * ls;\n    vec2 local = (p.xy - vec2(0.0, madeCenterY())) / size + 0.5;\n    vec2 uv = uMadeUV.xy + clamp(local, 0.0, 1.0) * uMadeUV.zw;\n    float sd = (texture(uLabels, uv).r - 0.5) * 2.0 * uLabelSpread * ls;   // name em\n    float inside = step(0.0, local.x) * step(local.x, 1.0) * step(0.0, local.y) * step(local.y, 1.0);\n    float aa = max(fwidth(sd), 1e-4);\n    float a = sat(0.5 - sd / aa) * inside;\n    float spr = uLabelSpread * ls;\n    shadow = pow(sat(1.0 - sd / (spr * 0.95)), 1.5) * inside;\n    vec3 n = R * vec3(0.0, 0.0, 1.0);\n    vec3 pw = R * p;\n    float light = 0.50 * keyLevel(t) * sat(dot(n, KEY_DIR)) + 0.40;\n    for (int i = 0; i < 4; i++) {\n        float I = flashI(i, t);\n        vec3 ld = flashPos(i) - pw;\n        light += I * 2.2 * sat(dot(n, normalize(ld))) * 9.0 / (9.0 + dot(ld, ld));\n    }\n    light += heroI(t) * 2.6;\n    // brushed champagne metal: faint horizontal streaks\n    float brush = 0.92 + 0.08 * vnoise(vec2(p.x * 40.0, p.y * 900.0));\n    vec3 col = vec3(0.95, 0.86, 0.68) * light * brush;\n    return vec4(col * a, a);\n}\n\n// =============================== night sky =====================================================\nvec3 starColor(float h) {\n    vec3 c1 = vec3(0.66, 0.78, 1.00), c2 = vec3(1.00, 0.97, 0.93), c3 = vec3(1.00, 0.78, 0.56);\n    return h < 0.55 ? mix(c1, c2, h / 0.55) : mix(c2, c3, (h - 0.55) / 0.45);\n}\n\n// stars on rings around the celestial pole; each one draws its trail arc [ts, ts + dTheta]\nvec3 starLayer(vec2 q, vec2 pole, float dr, float density, float gain, float dTheta, float sig, float seed, float defocus) {\n    vec2 rel = q - pole;\n    float r = length(rel);\n    float th = atan(rel.y, rel.x);\n    float rr = r / dr, ri = floor(rr), fr = rr - ri;\n    float sgm = sig * (1.0 + 2.6 * defocus);\n    float reach = 3.2 * sgm / dr;\n    float k0 = fr < reach ? -1.0 : 0.0;\n    float k1 = fr > 1.0 - reach ? 1.0 : 0.0;\n    float dimDef = (1.0 + 1.2 * defocus) / ((1.0 + 2.6 * defocus) * (1.0 + 2.6 * defocus));\n    vec3 acc = vec3(0.0);\n    for (int k = -1; k <= 1; k++) {\n        float fk = float(k);\n        if (fk < k0 || fk > k1) continue;\n        float ring = ri + fk;\n        if (ring < 2.0) continue;\n        float rc = (ring + 0.5) * dr;\n        float dth = dr / rc;\n        float jHi = floor(th / dth) + 1.0;\n        float jLo = floor((th - dTheta) / dth) - 1.0;\n        int n = int(min(jHi - jLo, 24.0));\n        for (int m = 0; m <= 24; m++) {\n            if (m > n) break;\n            float j = jLo + float(m);\n            vec2 cell = vec2(ring, j) + seed;\n            vec3 h = hash32(cell);\n            if (h.z > density) continue;\n            float rs = (ring + 0.2 + 0.6 * h.x) * dr;\n            float ts = (j + 0.2 + 0.6 * h.y) * dth;\n            float hb = hash12(cell + 17.31);\n            float b = gain * (0.045 + 2.6 * pow(hb, 11.0) + 0.22 * pow(hb, 3.0));\n            float s = sgm * (0.85 + 0.9 * pow(hb, 6.0));\n            float over = max(max(ts - th, th - (ts + dTheta)), 0.0) * r;\n            float radial = r - rs;\n            float dd = radial * radial + over * over;\n            float along = dTheta > 1e-5 ? sat((th - ts) / dTheta) : 1.0;\n            float trailK = dTheta > 1e-5 ? mix(0.16, 1.0, pow(along, 4.0)) : 1.0;\n            acc += starColor(fract(hb * 7.13)) * b * trailK * exp(-dd / (2.0 * s * s));\n        }\n    }\n    return acc * dimDef;\n}\n\nvec3 milkyWay(vec2 q, out float band) {\n    vec2 core = vec2(-55.0, -430.0);\n    vec2 dir = normalize(vec2(0.36, 0.93));\n    vec2 rel = q - core;\n    float along = dot(rel, dir);\n    float across = dot(rel, vec2(-dir.y, dir.x));\n    float w = 80.0 + 0.11 * max(along, 0.0);\n    band = exp(-across * across / (2.0 * w * w));\n    vec2 p = vec2(along, across) * 0.0046;\n    float n1 = fbm(p + vec2(3.1, 1.7));\n    float n2 = fbm(p * 2.6 + vec2(-1.3, 4.2));\n    float lane = exp(-pow(across / (w * 0.42) - 0.25 * sin(along * 0.006), 2.0));\n    float dust = smoothstep(0.40, 0.72, fbm(p * 1.7 + vec2(9.2, -3.3))) * lane;\n    float coreGlow = exp(-dot(rel, rel) / (2.0 * 165.0 * 165.0));\n    float dens = band * (0.30 + 1.0 * n1 * n1 + 0.40 * n2 * n2) * (1.0 - 0.85 * dust);\n    vec3 cool = vec3(0.52, 0.60, 0.80), warm = vec3(1.00, 0.76, 0.52);\n    vec3 c = mix(cool, warm, sat(coreGlow * 1.7 + 0.12)) * dens * 0.095;\n    c += warm * coreGlow * 0.10 * (1.0 - 0.7 * dust);\n    return c;\n}\n\nfloat ridge(float x, float seed) {\n    float h = 0.0, a = 0.5, f = 0.0032;\n    for (int i = 0; i < 5; i++) { h += a * (vnoise(vec2(x * f, seed)) * 2.0 - 1.0); f *= 2.13; a *= 0.48; }\n    return h;\n}\n\n// shutter iris that opens onto the sky; returns blade colour and coverage\nvec4 iris(vec2 q, vec2 c, float t) {\n    float o = easeInOutCubic((t - 0.02) / 0.28);\n    if (o >= 1.0) return vec4(0.0);\n    float halfDiag = length(vec2(500.0 * uRes.x / uRes.y, 500.0)) + length(c);\n    float R = mix(0.0, halfDiag * 1.08, o);\n    float rot = 1.05 * o;\n    vec2 p = q - c;\n    float r = length(p);\n    float a = atan(p.y, p.x) + rot;\n    float seg = 2.0 * PI / 9.0;\n    float am = mod(a, seg) - 0.5 * seg;\n    float polyD = r * cos(am) - R * cos(0.5 * seg);\n    float px = 1000.0 / uRes.y;\n    float cov = smoothstep(-px, px, polyD);\n    float sp = a + 0.85 * log((r + 30.0) / (R + 30.0));\n    float bi = floor(sp / seg);\n    float bf = fract(sp / seg);\n    float tilt = hash12(vec2(bi, 4.0));\n    vec3 base = vec3(0.028, 0.030, 0.036) * (0.7 + 0.6 * tilt);\n    float sheen = pow(sat(cos(sp - 0.6 + rot * 2.0)), 6.0) * 0.12 + pow(sat(cos(sp * 2.0 + 1.9)), 12.0) * 0.05;\n    base += vec3(0.50, 0.58, 0.72) * sheen * (0.4 + 0.6 * tilt);\n    float sw = 0.010;\n    base *= mix(0.2, 1.0, smoothstep(0.0, sw, bf));\n    base += vec3(0.60, 0.70, 0.85) * 0.06 * exp(-pow((bf - sw * 1.6) / sw, 2.0));\n    base += vec3(0.65, 0.78, 1.00) * 0.30 * exp(-max(polyD, 0.0) / (2.5 * px)) * step(0.0, polyD);\n    return vec4(base, cov);\n}\n\nvec3 background(vec2 frag, float t, vec2 blockPx) {\n    float e = easeOutCubic(t / T_END);\n    float sh = camShake(t);\n    vec2 q = (frag - 0.5 * uRes) / uRes.y * 1000.0;\n    q += vec2(-9.0, 5.0) * e + 6.0 * sh * vec2(sin(t * 173.0), cos(t * 131.0));\n    float px = 1000.0 / uRes.y;\n    float landscapeX = mix(1.0, 0.55, uLandscape);\n\n    // sky gradient\n    float hgt = sat((q.y + 420.0) / 920.0);\n    vec3 col = mix(vec3(0.030, 0.027, 0.052), vec3(0.004, 0.007, 0.021), pow(hgt, 0.55));\n\n    // mountains\n    float yFar = -318.0 + 72.0 * ridge(q.x * landscapeX + 25.0 * e + 300.0, 3.0);\n    float yNear = -398.0 + 58.0 * ridge(q.x * 1.25 * landscapeX + 55.0 * e - 120.0, 11.0);\n    float far = smoothstep(yFar + px, yFar - px, q.y);\n    float near = smoothstep(yNear + px, yNear - px, q.y);\n\n    if (far < 1.0) {\n        float defocus = 1.0 - smoothstep(0.17, 0.25, t);\n        float dTheta = 0.030 * easeOutQuart((t - 0.70) / 1.30);\n        vec2 pole = mix(vec2(-520.0, 760.0), vec2(-950.0, 880.0), uLandscape);\n        float band;\n        vec3 mw = milkyWay(q, band);\n        vec3 st = starLayer(q, pole, 9.0, 0.30 + 0.32 * band, 0.70, dTheta, 0.48, 0.0, defocus);\n        st += starLayer(q, pole, 23.0, 0.45, 1.35, dTheta, 0.60, 41.0, defocus);\n        col += (mw * (1.0 - 0.6 * defocus) + st);\n        // airglow and a faint warm horizon glow\n        col += vec3(0.020, 0.050, 0.030) * 0.55 * exp(-pow((q.y + 170.0) / 120.0, 2.0));\n        col += vec3(0.16, 0.085, 0.060) * 0.42 * exp(-max(q.y - yFar, 0.0) / 75.0);\n        col *= 1.0 - far;\n    }\n    vec3 farCol = mix(vec3(0.016, 0.019, 0.034), vec3(0.030, 0.032, 0.052), smoothstep(yFar - 60.0, yFar, q.y));\n    col += farCol * far * (1.0 - near);\n    col = mix(col, vec3(0.004, 0.004, 0.007), near);\n\n    // iris\n    vec4 ir = iris(q, (blockPx - 0.5 * uRes) / uRes.y * 1000.0, t);\n    col = mix(col, ir.rgb, ir.a);\n\n    // a soft shadow behind the lettering keeps the name standing out from the sky\n    vec2 hq = (frag - blockPx) / (uRes * vec2(0.50, mix(0.105, 0.21, uLandscape)));\n    col *= 1.0 - 0.62 * exp(-dot(hq, hq) * 1.6);\n    // faint glow from a backlight burst behind the letters at the hero flash\n    vec2 bq = (frag - blockPx) / uRes.y * 1000.0;\n    float back = pulse(t, HERO_T, 0.02, 0.16) * 0.22 + pulse(t, HERO_T, 0.02, 0.6) * 0.04;\n    col += vec3(0.55, 0.70, 1.00) * back * exp(-dot(bq * vec2(0.55, 1.6), bq * vec2(0.55, 1.6)) / (2.0 * 140.0 * 140.0));\n    return col;\n}\n\n// bright flash heads of the paparazzi bursts, with 6-point diffraction spikes\nvec3 flashSources(vec2 frag, vec3 ro, float t) {\n    vec3 acc = vec3(0.0);\n    float u = uRes.y * 0.001;\n    for (int i = 0; i < 4; i++) {\n        float I = flashI(i, t);\n        if (I < 0.003) continue;\n        vec2 sp = projectPx(flashPos(i), ro) * (uRes / uScreen);\n        vec2 dv = (frag - sp) / u;\n        float d = length(dv);\n        float g = 55.0 * exp(-d * d / (2.0 * 1.6 * 1.6)) + 4.0 * exp(-d / 5.0) + 0.5 * exp(-d / 38.0);\n        float spikes = 0.0;\n        for (int k = 0; k < 3; k++) {\n            float a = 0.26 + float(k) * PI / 3.0 + float(i) * 0.4;\n            vec2 ax = vec2(cos(a), sin(a));\n            float along = abs(dot(dv, ax));\n            float perp = abs(dot(dv, vec2(-ax.y, ax.x)));\n            spikes += exp(-perp * perp / (2.0 * 0.55 * 0.55)) * exp(-along / (55.0 * I + 8.0));\n        }\n        acc += vec3(1.0, 0.97, 0.93) * I * (g + 6.0 * spikes);\n    }\n    return acc;\n}\n\nvoid main() {\n    vec2 frag = gl_FragCoord.xy;\n    vec2 ndc = frag / uRes * 2.0 - 1.0;\n    float t = uTime;\n    vec3 ro; mat3 R;\n    camera(t, ro, R);\n    vec3 rd = cameraRay(ndc);\n    float pixAng = 2.0 * camTanX() / uRes.x;\n\n    vec2 blockPx = vec2(0.5, 0.5 + 0.5 * lensShift()) * uRes;\n    vec4 nm = renderName(ro, rd, R, t, pixAng);\n    float mbShadow;\n    vec4 mb = renderMadeBy(ro, rd, R, t, mbShadow);\n    vec3 col = vec3(0.0);\n    if (nm.a < 0.999) {\n        vec3 bg = background(frag, t, blockPx);\n        bg *= (1.0 - 0.65 * mbShadow) * mix(1.0, 0.6, uNight);   // at night the sky steps back from the name\n        bg = bg * (1.0 - mb.a) + mb.rgb;\n        col = bg * (1.0 - nm.a);\n    }\n    col += nm.rgb;\n    col += flashSources(frag, ro, t);\n    oColor = vec4(col, max(nm.a, mb.a));\n}\n", "particles.vert": "// Flash backscatter: dust motes near the lens light up as out-of-focus discs at the hero flash.\nout vec2 vLocal;\nout float vI;\nout float vRot;\n#define NPART 56\n\nvoid main() {\n    int pid = gl_VertexID / 6;\n    int cid = gl_VertexID - pid * 6;\n    vec2 corners[6] = vec2[6](vec2(-1.0, -1.0), vec2(1.0, -1.0), vec2(1.0, 1.0), vec2(-1.0, -1.0), vec2(1.0, 1.0), vec2(-1.0, 1.0));\n    vec2 corner = corners[cid];\n    float t = uTime;\n    vec3 ro; mat3 R;\n    camera(t, ro, R);\n    vec3 h = hash32(vec2(float(pid) * 1.37 + 3.1, 9.7));\n    vec3 h2 = hash32(vec2(float(pid) * 2.11 + 7.9, 1.3));\n    float D = ro.z;\n    float zc = mix(1.6, D * 0.62, h.z * h.z);                 // distance in front of the camera\n    float spanX = zc * camTanX() * 1.05, spanY = zc * camTanY() * 1.05;\n    vec3 pw = vec3(ro.x + (h.x * 2.0 - 1.0) * spanX, (h.y * 2.0 - 1.0) * spanY + 0.3, D - zc);\n    pw.xy += 0.10 * vec2(sin(t * 0.9 + h2.x * 6.28), cos(t * 0.7 + h2.y * 6.28));\n    vec2 sp = projectPx(pw, ro);\n    // circle of confusion: the letters are in focus, motes near the lens are big soft discs\n    float coc = clamp(0.020 * uScreen.y * abs(zc - D) / zc, 6.0, 0.10 * uScreen.y) * mix(0.8, 1.25, h2.z);\n    float I = heroI(t) * mix(0.25, 1.0, h2.x) * 0.42 / (1.0 + zc * zc * 0.05);\n    I *= (34.0 / coc) * (34.0 / coc) * 0.9 + 0.025;\n    // keep the name clear: dim discs whose centre falls on the lettering\n    vec2 blk = vec2(0.5, 0.5 + 0.5 * lensShift()) * uScreen;\n    vec2 hb = vec2(0.47 * uScreen.x, uScreen.x * mix(0.24, 0.09, uLandscape));\n    vec2 dq = abs(sp - blk) / hb;\n    I *= mix(0.05, 1.0, smoothstep(0.85, 1.25, max(dq.x, dq.y)));\n    vI = I;\n    vLocal = corner;\n    vRot = h2.y * 6.28;\n    vec2 ndc = (sp + corner * coc) / uScreen * 2.0 - 1.0;\n    gl_Position = vec4(ndc, 0.0, 1.0);\n    if (I < 0.0005) gl_Position = vec4(2.0, 2.0, 2.0, 1.0);\n}\n", "particles.frag": "in vec2 vLocal;\nin float vI;\nin float vRot;\nlayout(location = 0) out vec4 oColor;\n\n// 9-blade aperture shaped bokeh with a bright rim and a little colour fringing\nfloat bokeh(vec2 p) {\n    float r = length(p);\n    float a = atan(p.y, p.x) + vRot;\n    float seg = 2.0 * PI / 9.0;\n    float rp = r * cos(mod(a, seg) - 0.5 * seg) / cos(0.5 * seg);\n    float body = smoothstep(1.0, 0.90, rp);\n    return body * (0.62 + 0.38 * smoothstep(0.55, 0.97, rp));\n}\n\nvoid main() {\n    vec3 c = vec3(bokeh(vLocal * 1.035), bokeh(vLocal), bokeh(vLocal * 0.965));\n    oColor = vec4(c * vec3(1.0, 0.97, 0.92) * vI, 1.0);\n}\n", "bright.frag": "// First bloom step: 13-tap downsample of the HDR scene with a soft-knee threshold.\nuniform sampler2D uSrc;\nuniform vec2 uSrcTexel;\nuniform float uThreshold;\nlayout(location = 0) out vec4 oColor;\nvec3 tap(vec2 uv) { return min(texture(uSrc, uv).rgb, vec3(40.0)); }\nvoid main() {\n    vec2 uv = gl_FragCoord.xy / uRes;\n    vec2 o = uSrcTexel;\n    vec3 a = tap(uv + o * vec2(-2.0, 2.0)), b = tap(uv + o * vec2(0.0, 2.0)), c = tap(uv + o * vec2(2.0, 2.0));\n    vec3 d = tap(uv + o * vec2(-2.0, 0.0)), e = tap(uv), f = tap(uv + o * vec2(2.0, 0.0));\n    vec3 g = tap(uv + o * vec2(-2.0, -2.0)), h = tap(uv + o * vec2(0.0, -2.0)), i = tap(uv + o * vec2(2.0, -2.0));\n    vec3 j = tap(uv + o * vec2(-1.0, 1.0)), k = tap(uv + o * vec2(1.0, 1.0)), l = tap(uv + o * vec2(-1.0, -1.0)), m = tap(uv + o * vec2(1.0, -1.0));\n    vec3 col = e * 0.125 + (a + c + g + i) * 0.03125 + (b + d + f + h) * 0.0625 + (j + k + l + m) * 0.125;\n    float br = max(col.r, max(col.g, col.b));\n    float knee = uThreshold * 0.5;\n    float rq = clamp(br - uThreshold + knee, 0.0, 2.0 * knee);\n    rq = rq * rq / (4.0 * knee + 1e-4);\n    float w = max(rq, br - uThreshold) / max(br, 1e-4);\n    oColor = vec4(col * w, 1.0);\n}\n", "down.frag": "uniform sampler2D uSrc;\nuniform vec2 uSrcTexel;\nlayout(location = 0) out vec4 oColor;\nvoid main() {\n    vec2 uv = gl_FragCoord.xy / uRes;\n    vec2 o = uSrcTexel;\n    vec3 a = texture(uSrc, uv + o * vec2(-2.0, 2.0)).rgb, b = texture(uSrc, uv + o * vec2(0.0, 2.0)).rgb, c = texture(uSrc, uv + o * vec2(2.0, 2.0)).rgb;\n    vec3 d = texture(uSrc, uv + o * vec2(-2.0, 0.0)).rgb, e = texture(uSrc, uv).rgb, f = texture(uSrc, uv + o * vec2(2.0, 0.0)).rgb;\n    vec3 g = texture(uSrc, uv + o * vec2(-2.0, -2.0)).rgb, h = texture(uSrc, uv + o * vec2(0.0, -2.0)).rgb, i = texture(uSrc, uv + o * vec2(2.0, -2.0)).rgb;\n    vec3 j = texture(uSrc, uv + o * vec2(-1.0, 1.0)).rgb, k = texture(uSrc, uv + o * vec2(1.0, 1.0)).rgb;\n    vec3 l = texture(uSrc, uv + o * vec2(-1.0, -1.0)).rgb, m = texture(uSrc, uv + o * vec2(1.0, -1.0)).rgb;\n    oColor = vec4(e * 0.125 + (a + c + g + i) * 0.03125 + (b + d + f + h) * 0.0625 + (j + k + l + m) * 0.125, 1.0);\n}\n", "up.frag": "// Bloom upsample: 3x3 tent of the smaller level added onto this level.\nuniform sampler2D uLow;\nuniform sampler2D uCur;\nuniform vec2 uLowTexel;\nlayout(location = 0) out vec4 oColor;\nvoid main() {\n    vec2 uv = gl_FragCoord.xy / uRes;\n    vec2 o = uLowTexel;\n    vec3 s = texture(uLow, uv).rgb * 4.0;\n    s += (texture(uLow, uv + vec2(o.x, 0.0)).rgb + texture(uLow, uv - vec2(o.x, 0.0)).rgb\n        + texture(uLow, uv + vec2(0.0, o.y)).rgb + texture(uLow, uv - vec2(0.0, o.y)).rgb) * 2.0;\n    s += texture(uLow, uv + o).rgb + texture(uLow, uv - o).rgb + texture(uLow, uv + vec2(o.x, -o.y)).rgb + texture(uLow, uv + vec2(-o.x, o.y)).rgb;\n    oColor = vec4(s / 16.0 + texture(uCur, uv).rgb, 1.0);\n}\n", "streak.frag": "// Anamorphic flare: wide horizontal blur of the bright pass, applied in a few growing steps.\nuniform sampler2D uSrc;\nuniform vec2 uStep;      // uv step between taps\nuniform float uGain;\nlayout(location = 0) out vec4 oColor;\nvoid main() {\n    vec2 uv = gl_FragCoord.xy / uRes;\n    vec3 c = vec3(0.0);\n    float ws = 0.0;\n    for (int i = -7; i <= 7; i++) {\n        float w = exp(-abs(float(i)) * 0.30);\n        c += texture(uSrc, uv + uStep * float(i)).rgb * w;\n        ws += w;\n    }\n    oColor = vec4(c / ws * uGain, 1.0);\n}\n", "rays.frag": "// Light shafts from a burst behind the letters: radial blur of the open (unoccluded) source.\nuniform sampler2D uScene;   // alpha = letter coverage\nuniform vec2 uLight;        // light centre in uv\nlayout(location = 0) out vec4 oColor;\nvoid main() {\n    vec2 uv = gl_FragCoord.xy / uRes;\n    float t = uTime;\n    float I = pulse(t, HERO_T, 0.02, 0.20) + 0.25 * pulse(t, HERO_T, 0.02, 0.65);\n    if (I < 0.002) { oColor = vec4(0.0, 0.0, 0.0, 1.0); return; }\n    vec2 delta = (uv - uLight) * (0.85 / 40.0);\n    vec2 p = uv;\n    float acc = 0.0, decay = 1.0;\n    vec2 ext = vec2(0.40, mix(0.065, 0.11, uLandscape));\n    for (int i = 0; i < 40; i++) {\n        vec2 dq = (p - uLight) / ext;\n        float src = exp(-dot(dq, dq) * 1.4);\n        float open = 1.0 - texture(uScene, p).a;\n        acc += src * open * decay;\n        decay *= 0.955;\n        p -= delta;\n    }\n    oColor = vec4(vec3(acc / 40.0 * I), 1.0);\n}\n", "final.frag": "// Final composite: lens (chromatic aberration, bloom, anamorphic streak, light shafts, flash veil),\n// filmic tone map, vignette, then the viewfinder HUD, grain and dither. Writes display sRGB.\n// The night look (uNight) turns the picture into Night Sky's red night-vision palette and softens the flash.\nuniform sampler2D uScene;\nuniform sampler2D uBloom;\nuniform sampler2D uStreak;\nuniform sampler2D uRays;\nuniform sampler2D uLabels;\nlayout(location = 0) out vec4 oColor;\n\nvec3 aces(vec3 x) {\n    const mat3 i = mat3(0.59719, 0.07600, 0.02840, 0.35458, 0.90834, 0.13383, 0.04823, 0.01566, 0.83777);\n    const mat3 o = mat3(1.60475, -0.10208, -0.00327, -0.53108, 1.10813, -0.07276, -0.07367, -0.00605, 1.07602);\n    vec3 v = i * x;\n    vec3 a = v * (v + 0.0245786) - 0.000090537;\n    vec3 b = v * (0.983729 * v + 0.4329510) + 0.238081;\n    return clamp(o * (a / b), 0.0, 1.0);\n}\nvec3 toSRGB(vec3 c) {\n    c = clamp(c, 0.0, 1.0);\n    return mix(c * 12.92, 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055, step(0.0031308, c));\n}\n\n// corner brackets of the autofocus frame (px space); returns coverage\nfloat brackets(vec2 p, vec2 c, vec2 hs, float arm, float th) {\n    vec2 d = abs(p - c) - hs;          // distance outside the frame edges\n    vec2 q = abs(p - c);\n    float onV = step(hs.y - arm, q.y) * (1.0 - smoothstep(th * 0.5 - 0.5, th * 0.5 + 0.5, abs(d.x)));\n    float onH = step(hs.x - arm, q.x) * (1.0 - smoothstep(th * 0.5 - 0.5, th * 0.5 + 0.5, abs(d.y)));\n    float inside = step(q.x, hs.x + th) * step(q.y, hs.y + th);\n    return max(onV, onH) * inside;\n}\n\n// Night Sky's screen colours (RED_DARK, RED_DIM, RED), display sRGB\nconst vec3 NIGHT_DARK = vec3(0.165, 0.031, 0.027);\nconst vec3 NIGHT_DIM  = vec3(0.604, 0.165, 0.145);\nconst vec3 NIGHT_RED  = vec3(0.898, 0.224, 0.208);\n\n// display lightness (0..1) -> the red palette; every channel rises with v\nvec3 nightRamp(float v) {\n    vec3 c = NIGHT_DARK * sat(v / 0.16);\n    c = mix(c, NIGHT_DIM, smoothstep(0.16, 0.60, v));\n    return mix(c, NIGHT_RED, smoothstep(0.60, 1.0, v));\n}\n\nfloat hudText(vec2 p, vec2 centre, float pxPerEm) {\n    vec2 size = uHudSize * pxPerEm;\n    vec2 local = (p - centre) / size + 0.5;\n    if (local.x < 0.0 || local.x > 1.0 || local.y < 0.0 || local.y > 1.0) return 0.0;\n    float sd = (texture(uLabels, uHudUV.xy + local * uHudUV.zw).r - 0.5) * 2.0 * uLabelSpread * pxPerEm;\n    return sat(0.5 - sd);\n}\n\nvoid main() {\n    vec2 frag = gl_FragCoord.xy;\n    vec2 uv = frag / uScreen;\n    float t = uTime;\n    float hero = heroI(t);\n    float pap = papSum(t);\n\n    vec2 dc = uv - vec2(0.5, 0.5 + 0.5 * lensShift());\n    float ca = 0.0010 + 0.0065 * hero + 0.0015 * pap;\n    float soft = mix(1.0, 0.55, uNight);              // the night look keeps the flash glow lower\n    vec3 c;\n    c.r = texture(uScene, uv - dc * ca).r;\n    c.g = texture(uScene, uv).g;\n    c.b = texture(uScene, uv + dc * ca).b;\n    c += texture(uBloom, uv).rgb * (0.080 + 0.06 * hero) * soft;\n    c += texture(uStreak, uv).rgb * vec3(0.32, 0.52, 1.00) * (0.55 - 0.25 * sat(hero)) * soft;\n    c += texture(uRays, uv).rgb * vec3(0.50, 0.66, 1.00) * 0.9 * soft;\n    c += vec3(0.93, 0.96, 1.00) * (0.10 * pulse(t, HERO_T, 0.010, 0.030) + 0.020 * pap) * mix(1.0, 0.35, uNight);\n    c = aces(c * 1.05 * mix(1.0, 0.85, uNight));\n    vec2 vq = (uv - 0.5) * vec2(uScreen.x / uScreen.y, 1.0);\n    c *= mix(1.0, smoothstep(1.15, 0.15, length(vq) * 1.25), 0.50);\n    vec3 s = toSRGB(c);\n    if (uNight > 0.0) {\n        // like black-and-white film through a red filter: the blue sky drops away, the gold edges lift\n        float v = toSRGB(vec3(dot(c, vec3(0.58, 0.36, 0.06)))).x;\n        s = mix(s, nightRamp(v), uNight);\n    }\n\n    // ---- viewfinder HUD ----\n    float u = uScreen.y * 0.001;                       // 1/1000 of the screen height in px\n    vec3 ro; mat3 R;\n    camera(t, ro, R);\n    vec2 blk = projectPx(vec3(0.0, 0.5 * (madeCenterY() + 0.35 * labelScale()) - 0.5 * uNameInk.y * 0.5, 0.0), ro);\n    vec2 ext = projectPx(vec3(uNameInk.x * 0.5, madeCenterY() + 0.35 * labelScale(), 0.0), ro) - projectPx(vec3(0.0, -uNameInk.y * 0.5, 0.0), ro);\n    vec2 hs = vec2(ext.x, ext.y * 0.5) + vec2(26.0, 30.0) * u;\n    float k = easeOutQuart((t - 0.05) / 0.19);\n    hs *= mix(1.22, 1.0, k);\n    float bA = smoothstep(0.04, 0.09, t) * (1.0 - smoothstep(0.95, 1.25, t));\n    float lockFlash = smoothstep(0.235, 0.245, t) * (1.0 - smoothstep(0.36, 0.52, t));\n    vec3 bCol = mix(mix(vec3(0.92, 0.95, 1.00), vec3(0.42, 1.00, 0.58), lockFlash),\n                    mix(NIGHT_DIM, NIGHT_RED, lockFlash), uNight);\n    float br = brackets(frag, blk, hs, 22.0 * u, max(2.2 * u, 1.5));\n    s = mix(s, bCol, br * bA * 0.85);\n\n    // exposure readout + progress line\n    float pxPerE const INTRO_LEN = 2.2;           // seconds, matches T_END in the shaders
const POSTER_T = 2.2;            // still shown before the first play: the finished frame
const HERO_T = 0.64;
const FLASH_TIMES = [0.34, 0.43, 0.505, 0.565];

// ------------------------------------------------------------------------------------------------
// Renderer. Mirrors the Android GLES 3.0 renderer pass for pass; every bit of animation lives in
// the shared GLSL, so the host only runs passes and feeds uTime.
// ------------------------------------------------------------------------------------------------
class FlashIntro {
  constructor(canvas, assets) {
    const gl = canvas.getContext("webgl2", { antialias: false, alpha: false, depth: false, stencil: false,
      premultipliedAlpha: false, preserveDrawingBuffer: !!window.__PRESERVE, powerPreference: "high-performance" });
    if (!gl) throw new Error("no-webgl2");
    this.gl = gl;
    this.assets = assets;
    this.vao = gl.createVertexArray();
    this.programs = {};
    this.targets = null;
    this.w = 0; this.h = 0;
    this.night = 0;        // 0 the standard look, 1 the red night look
    this.px = new Uint8Array(4);
    this.fmt = this._pickFormat();
    this._buildPrograms();
    const M = MANIFEST;
    this.texPortrait = this._tex(M.portrait.w, M.portrait.h, gl.R16F, gl.RED, gl.FLOAT, assets.portrait, false);
    this.texLandscape = this._tex(M.landscape.w, M.landscape.h, gl.R16F, gl.RED, gl.FLOAT, assets.landscape, false);
    this.texLabels = this._tex(M.labels.w, M.labels.h, gl.R8, gl.RED, gl.UNSIGNED_BYTE, assets.labels, true);
  }

  _pickFormat() {
    const gl = this.gl;
    const f = gl.getExtension("EXT_color_buffer_float");
    const h = gl.getExtension("EXT_color_buffer_half_float");
    if (f || h) {
      const tex = this._tex(4, 4, gl.RGBA16F, gl.RGBA, gl.HALF_FLOAT, null, false);
      const fb = gl.createFramebuffer();
      gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
      const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.deleteFramebuffer(fb); gl.deleteTexture(tex);
      if (ok) return { internal: gl.RGBA16F, type: gl.HALF_FLOAT, hdr: true };
    }
    return { internal: gl.RGBA8, type: gl.UNSIGNED_BYTE, hdr: false };
  }

  _buildPrograms() {
    const gl = this.gl;
    const head = "#version 300 es\nprecision highp float;\nprecision highp int;\nprecision highp sampler2D;\n" + SHADERS["common.glsl"] + "\n";
    const list = [["scene", "fullscreen.vert", "scene.frag"], ["particles", "particles.vert", "particles.frag"],
      ["bright", "fullscreen.vert", "bright.frag"], ["down", "fullscreen.vert", "down.frag"], ["up", "fullscreen.vert", "up.frag"],
      ["streak", "fullscreen.vert", "streak.frag"], ["rays", "fullscreen.vert", "rays.frag"], ["final", "fullscreen.vert", "final.frag"]];
    const pending = [];
    for (const [name, vs, fs] of list) {   // compile everything first so the driver can work in parallel
      const p = gl.createProgram();
      const v = gl.createShader(gl.VERTEX_SHADER), f = gl.createShader(gl.FRAGMENT_SHADER);
      gl.shaderSource(v, head + SHADERS[vs]); gl.compileShader(v);
      gl.shaderSource(f, head + SHADERS[fs]); gl.compileShader(f);
      gl.attachShader(p, v); gl.attachShader(p, f);
      gl.linkProgram(p);
      pending.push({ name, p, v, f, vs, fs });
    }
    for (const { name, p, v, f, vs, fs } of pending) {
      if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
        const log = (!gl.getShaderParameter(f, gl.COMPILE_STATUS) ? fs + ": " + gl.getShaderInfoLog(f)
          : !gl.getShaderParameter(v, gl.COMPILE_STATUS) ? vs + ": " + gl.getShaderInfoLog(v) : name + ": " + gl.getProgramInfoLog(p));
        throw new Error("shader-failed\n" + log);
      }
      const u = {};
      const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
      for (let i = 0; i < n; i++) { const info = gl.getActiveUniform(p, i); u[info.name] = gl.getUniformLocation(p, info.name); }
      this.programs[name] = { p, u };
    }
  }

  _tex(w, h, internal, format, type, data, mips) {
    const gl = this.gl;
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
    gl.texImage2D(gl.TEXTURE_2D, 0, internal, w, h, 0, format, type, data);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, mips ? gl.LINEAR_MIPMAP_LINEAR : gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    if (mips) gl.generateMipmap(gl.TEXTURE_2D);
    return t;
  }

  _rt(w, h) {
    const gl = this.gl;
    const tex = this._tex(w, h, this.fmt.internal, gl.RGBA, this.fmt.type, null, false);
    const fb = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return { tex, fb, w, h };
  }

  _freeTargets() {
    if (!this.targets) return;
    const gl = this.gl, T = this.targets;
    for (const r of [T.scene, ...T.down, ...T.up, T.stA, T.stB, T.rays]) { gl.deleteTexture(r.tex); gl.deleteFramebuffer(r.fb); }
    this.targets = null;
  }

  resize(w, h) {
    if (w === this.w && h === this.h && this.targets) return;
    const gl = this.gl;
    this.w = w; this.h = h;
    gl.canvas.width = w; gl.canvas.height = h;
    this._freeTargets();
    const T = { scene: this._rt(w, h), down: [], up: [] };
    let dw = w, dh = h;
    for (let i = 0; i < 6; i++) {
      dw = Math.max(1, Math.round(dw / 2)); dh = Math.max(1, Math.round(dh / 2));
      T.down.push(this._rt(dw, dh));
    }
    for (let i = 0; i < 5; i++) T.up.push(this._rt(T.down[i].w, T.down[i].h));
    const q = T.down[1];
    T.stA = this._rt(q.w, q.h); T.stB = this._rt(q.w, q.h); T.rays = this._rt(q.w, q.h);
    this.targets = T;
  }

  _use(name, target, t) {
    const gl = this.gl, P = this.programs[name], M = MANIFEST;
    gl.useProgram(P.p);
    if (target) { gl.bindFramebuffer(gl.FRAMEBUFFER, target.fb); gl.viewport(0, 0, target.w, target.h); }
    else { gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, this.w, this.h); }
    const u = P.u;
    const land = this.w > this.h * 1.15;
    const N = land ? M.landscape : M.portrait;
    const L = M.labels;
    const set1 = (k, v) => { if (u[k]) gl.uniform1f(u[k], v); };
    const set2 = (k, a, b) => { if (u[k]) gl.uniform2f(u[k], a, b); };
    const set4 = (k, a) => { if (u[k]) gl.uniform4f(u[k], a[0], a[1], a[2], a[3]); };
    set1("uTime", t);
    set2("uRes", target ? target.w : this.w, target ? target.h : this.h);
    set2("uScreen", this.w, this.h);
    set4("uNameRect", N.rect);
    set2("uNameInk", N.ink[0], N.ink[1]);
    set1("uNameSpread", N.spreadEm);
    set1("uNameEps", 0.7 / N.emTex);
    set4("uMadeUV", L.items.madeBy.uv);
    set2("uMadeSize", L.items.madeBy.sizeEm[0], L.items.madeBy.sizeEm[1]);
    set4("uHudUV", L.items.hud.uv);
    set2("uHudSize", L.items.hud.sizeEm[0], L.items.hud.sizeEm[1]);
    set1("uLabelSpread", L.spreadEm);
    set1("uLandscape", land ? 1 : 0);
    set1("uNight", this.night);
    P.land = land;
    return P;
  }

  _bindTex(P, name, unit, tex) {
    const gl = this.gl;
    if (!P.u[name]) return;
    gl.activeTexture(gl.TEXTURE0 + unit);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.uniform1i(P.u[name], unit);
  }

  _fs() { this.gl.drawArrays(this.gl.TRIANGLES, 0, 3); }

  render(t) {
    const gl = this.gl, T = this.targets;
    t = Math.max(0, Math.min(INTRO_LEN, t));
    gl.bindVertexArray(this.vao);
    gl.disable(gl.BLEND);

    // 1. scene: sky, iris, 3D name, label, flash heads
    let P = this._use("scene", T.scene, t);
    this._bindTex(P, "uNameSdf", 0, P.land ? this.texLandscape : this.texPortrait);
    this._bindTex(P, "uLabels", 1, this.texLabels);
    this._fs();

    // 2. flash backscatter discs (additive)
    if (t > 0.6 && t < 1.6) {
      this._use("particles", T.scene, t);
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.ONE, gl.ONE);
      gl.colorMask(true, true, true, false);
      gl.drawArrays(gl.TRIANGLES, 0, 56 * 6);
      gl.colorMask(true, true, true, true);
      gl.disable(gl.BLEND);
    }

    // 3. bloom chain
    P = this._use("bright", T.down[0], t);
    this._bindTex(P, "uSrc", 0, T.scene.tex);
    gl.uniform2f(P.u.uSrcTexel, 1 / T.scene.w, 1 / T.scene.h);
    gl.uniform1f(P.u.uThreshold, 1.0);
    this._fs();
    for (let i = 1; i < 6; i++) {
      P = this._use("down", T.down[i], t);
      this._bindTex(P, "uSrc", 0, T.down[i - 1].tex);
      gl.uniform2f(P.u.uSrcTexel, 1 / T.down[i - 1].w, 1 / T.down[i - 1].h);
      this._fs();
    }
    for (let i = 4; i >= 0; i--) {
      const low = i === 4 ? T.down[5] : T.up[i + 1];
      P = this._use("up", T.up[i], t);
      this._bindTex(P, "uLow", 0, low.tex);
      this._bindTex(P, "uCur", 1, T.down[i].tex);
      gl.uniform2f(P.u.uLowTexel, 1 / low.w, 1 / low.h);
      this._fs();
    }

    // 4. anamorphic streak from the quarter-res bright level
    const q = T.down[1];
    for (const [step, src, dst, gain] of [[1.0, T.down[1], T.stA, 1.0], [5.0, T.stA, T.stB, 1.0], [25.0, T.stB, T.stA, 2.2]]) {
      P = this._use("streak", dst, t);
      this._bindTex(P, "uSrc", 0, src.tex);
      gl.uniform2f(P.u.uStep, step / q.w, 0);
      gl.uniform1f(P.u.uGain, gain);
      this._fs();
    }

    // 5. light shafts
    P = this._use("rays", T.rays, t);
    this._bindTex(P, "uScene", 0, T.scene.tex);
    gl.uniform2f(P.u.uLight, 0.5, P.land ? 0.5 + 0.5 * 0.03 : 0.5 + 0.5 * 0.075 + 0.01);
    this._fs();

    // 6. final composite to the screen
    P = this._use("final", null, t);
    this._bindTex(P, "uScene", 0, T.scene.tex);
    this._bindTex(P, "uBloom", 1, T.up[0].tex);
    this._bindTex(P, "uStreak", 2, T.stA.tex);
    this._bindTex(P, "uRays", 3, T.rays.tex);
    this._bindTex(P, "uLabels", 4, this.texLabels);
    this._fs();
  }

  // wait for the GPU (used only to time frames)
  sync() { const gl = this.gl; gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, this.px); }
}

// ------------------------------------------------------------------------------------------------
// Embedded data
// ------------------------------------------------------------------------------------------------
function b64Bytes(s) {
  const bin = atob(s);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
async function gunzip(bytes) {
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
// 16-bit fixed point, delta coded along rows, low bytes then high bytes
function decodeField(bytes, w, h) {
  const n = w * h, out = new Float32Array(n);
  for (let y = 0; y < h; y++) {
    let acc = 0;
    for (let x = 0, i = y * w; x < w; x++, i++) {
      acc = (acc + (bytes[i] | (bytes[n + i] << 8))) & 0xffff;
      out[i] = ((acc << 16) >> 16) / 32767;
    }
  }
  return out;
}
async function loadAssets() {
  const M = MANIFEST;
  const [p, l, lab] = await Promise.all([gunzip(b64Bytes(DATA.portrait)), gunzip(b64Bytes(DATA.landscape)), gunzip(b64Bytes(DATA.labels))]);
  return { portrait: decodeField(p, M.portrait.w, M.portrait.h), landscape: decodeField(l, M.landscape.w, M.landscape.h), labels: lab };
}

// ------------------------------------------------------------------------------------------------
// Player
// ------------------------------------------------------------------------------------------------
const $ = (id) => document.getElementById(id);
const canvas = $("intro"), bar = $("bar"), shutter = $("shutter"), shutterLabel = $("shutter-label");
const slowBtn = $("slow"), soundBtn = $("sound"), soundLabel = $("sound-label"), scrub = $("scrub"), timeOut = $("time");
const notice = $("notice");

let intro = null, assets = null;
let scale = 1;               // render scale on top of the (capped) device pixel ratio
let mode = "loading";        // loading | idle | playing | error
let shownT = POSTER_T;
let slow = false, soundOn = true, playedOnce = false;
let night = false, nightMix = 0, lookRaf = 0;   // the look, and how far the picture has faded to it
let raf = 0, clock = null, stats = null;
let actx = null, gainNode = null, soundBuf = null, soundFailed = false, srcNode = null;
let timers = [];

function showNotice(html) { notice.innerHTML = html; notice.hidden = false; }

function applySize() {
  const r = canvas.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(2, Math.round(Math.max(1, r.width) * dpr * scale));
  const h = Math.max(2, Math.round(Math.max(1, r.height) * dpr * scale));
  intro.resize(w, h);
}

function draw(t) {
  shownT = t;
  intro.render(t);
}

function syncUi() {
  timeOut.textContent = shownT.toFixed(2) + " s";
  scrub.value = String(Math.round(shownT * 1000));
  scrub.style.setProperty("--fill", (shownT / INTRO_LEN * 100).toFixed(2) + "%");
  const replay = playedOnce;
  $("icon-play").toggleAttribute("hidden", replay); $("icon-replay").toggleAttribute("hidden", !replay);
  shutter.setAttribute("aria-label", replay ? "Replay intro" : "Play intro");
  shutterLabel.textContent = mode === "loading" ? "Loading" : replay ? "Replay" : "Play";
  slowBtn.setAttribute("aria-pressed", String(slow));
  soundBtn.setAttribute("aria-pressed", String(soundOn && !soundFailed));
  soundBtn.disabled = soundFailed;
  $("icon-sound-on").toggleAttribute("hidden", !(soundOn && !soundFailed)); $("icon-sound-off").toggleAttribute("hidden", soundOn && !soundFailed);
  soundLabel.textContent = soundFailed ? "No sound" : soundOn ? (slow ? "Off in slow-mo" : "Sound on") : "Sound off";
}

function setBarAway(away) { bar.classList.toggle("away", away); }

// Standard or Night. The picture crossfades to the new look; the bar switches with it.
function setLook(n, animate) {
  night = n;
  document.documentElement.dataset.look = n ? "night" : "standard";
  $("look-standard").setAttribute("aria-checked", String(!n));
  $("look-night").setAttribute("aria-checked", String(n));
  try { localStorage.setItem("flash-intro-look", n ? "night" : "standard"); } catch (e) { /* storage blocked: the look just isn't remembered */ }
  cancelAnimationFrame(lookRaf);
  const from = nightMix, to = n ? 1 : 0;
  const still = () => intro && mode !== "playing" && mode !== "error";
  if (!animate || !intro || matchMedia("(prefers-reduced-motion: reduce)").matches) {
    nightMix = to;
    if (intro) { intro.night = to; if (still()) draw(shownT); }
    return;
  }
  const t0 = performance.now();
  const step = (now) => {
    const k = Math.min(1, (now - t0) / 260), e = k * k * (3 - 2 * k);
    nightMix = from + (to - from) * e;
    if (!intro) return;
    intro.night = nightMix;
    if (still()) draw(shownT);
    if (k < 1) lookRaf = requestAnimationFrame(step);
  };
  lookRaf = requestAnimationFrame(step);
}
function savedLook() {
  if (location.hash === "#night") return true;
  if (location.hash === "#standard") return false;
  try { return localStorage.getItem("flash-intro-look") === "night"; } catch (e) { return false; }
}

// frame cost decides the render scale; the intro should run at full frame rate on the phone
function timeFrame(t) { const t0 = performance.now(); intro.render(t); intro.sync(); return performance.now() - t0; }
function benchmark() {
  if (window.__FIXED_SCALE) { scale = window.__FIXED_SCALE; applySize(); return; }
  scale = 1; applySize();
  timeFrame(POSTER_T);                                    // first draw includes one-time driver work
  const a = Math.min(timeFrame(POSTER_T), timeFrame(POSTER_T));
  const b = Math.min(timeFrame(0.70), timeFrame(0.70));
  const ms = Math.max(a, b), budget = 12;
  scale = ms <= budget ? 1 : Math.max(0.5, Math.round(Math.sqrt(budget / ms) * 20) / 20);
  applySize();
}
// after each play: frames that ran late lower the scale for the next one, smooth runs raise it back
function adaptScale() {
  if (!stats || stats.n < 20 || window.__FIXED_SCALE) return;
  const late = stats.late / stats.n, before = scale;
  if (late > 0.15) scale = Math.max(0.5, Math.round(scale * 0.85 * 20) / 20);
  else if (late < 0.02 && scale < 1) scale = Math.min(1, Math.round(scale * 1.1 * 20) / 20);
  if (scale !== before) applySize();
}

// ---- sound ----
function setupAudio() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) { soundFailed = true; return; }
  try {
    actx = new AC({ latencyHint: "interactive" });
    gainNode = actx.createGain();
    gainNode.connect(actx.destination);
    const bytes = b64Bytes(DATA.sound);
    actx.decodeAudioData(bytes.buffer, (b) => { soundBuf = b; }, () => { soundFailed = true; syncUi(); });
  } catch (e) { soundFailed = true; }
}
function audioNow() {
  if (actx.getOutputTimestamp) {
    const ts = actx.getOutputTimestamp();
    if (ts && ts.contextTime > 0 && ts.performanceTime > 0) return ts.contextTime + (performance.now() - ts.performanceTime) / 1000;
  }
  return actx.currentTime - (actx.outputLatency || actx.baseLatency || 0);
}
function scheduleHaptics(speed) {
  if (!("vibrate" in navigator)) return;
  const at = (t, ms) => timers.push(setTimeout(() => { try { navigator.vibrate(ms); } catch (e) { /* not allowed here */ } }, t / speed * 1000 + 40));
  for (const t of FLASH_TIMES) at(t, 8);
  at(HERO_T, 38);
}

// ---- playback ----
function stopPlayback() {
  cancelAnimationFrame(raf);
  raf = 0;
  if (srcNode) { try { srcNode.stop(); } catch (e) { /* already stopped */ } srcNode = null; }
  for (const id of timers) clearTimeout(id);
  timers = [];
}

function play() {
  if (!intro || mode === "loading" || mode === "error") return;
  stopPlayback();
  if (actx && actx.state !== "running") actx.resume().catch(() => {});
  mode = "playing";
  setBarAway(true);
  const speed = slow ? 0.25 : 1;
  if (soundOn && !slow && actx && soundBuf) {
    const startAt = actx.currentTime + 0.05;
    srcNode = actx.createBufferSource();
    srcNode.buffer = soundBuf;
    srcNode.connect(gainNode);
    srcNode.start(startAt);
    clock = () => audioNow() - startAt;
  } else {
    const t0 = performance.now() + 30;
    clock = () => (performance.now() - t0) / 1000 * speed;
  }
  if (soundOn) scheduleHaptics(speed);
  stats = { n: 0, late: 0, last: 0 };
  draw(0);
  raf = requestAnimationFrame(tick);
}

function tick(now) {
  if (mode !== "playing") return;
  if (stats.last) { stats.n++; if (now - stats.last > 26) stats.late++; }
  stats.last = now;
  const t = clock();
  if (t >= INTRO_LEN) { draw(INTRO_LEN); end(); return; }
  draw(Math.max(0, t));
  raf = requestAnimationFrame(tick);
}

function end() {
  mode = "idle";
  playedOnce = true;
  raf = 0;
  adaptScale();
  draw(shownT);
  syncUi();
  timers.push(setTimeout(() => { if (mode === "idle") setBarAway(false); }, 450));
}

function pauseHere() {
  stopPlayback();
  mode = "idle";
  playedOnce = true;
  syncUi();
  setBarAway(false);
}

// ---- wiring ----
shutter.addEventListener("click", play);
canvas.addEventListener("click", () => { if (mode === "playing") pauseHere(); else play(); });
slowBtn.addEventListener("click", () => { slow = !slow; syncUi(); });
$("look-standard").addEventListener("click", () => { if (night) setLook(false, true); });
$("look-night").addEventListener("click", () => { if (!night) setLook(true, true); });
window.addEventListener("hashchange", () => { const n = savedLook(); if (n !== night) setLook(n, true); });
soundBtn.addEventListener("click", () => { soundOn = !soundOn; syncUi(); });
scrub.addEventListener("input", () => {
  if (!intro) return;
  if (mode === "playing") { stopPlayback(); mode = "idle"; playedOnce = true; }
  draw(Number(scrub.value) / 1000);
  syncUi();
});
document.addEventListener("visibilitychange", () => { if (document.hidden && mode === "playing") pauseHere(); });
new ResizeObserver(() => {
  if (!intro || mode === "error") return;
  applySize();
  if (mode !== "playing") draw(shownT);
}).observe(canvas);
canvas.addEventListener("webglcontextlost", (e) => {
  e.preventDefault();
  stopPlayback();
  intro = null; mode = "error";
  showNotice("<strong>The graphics driver reset.</strong> It comes back by itself in a moment.");
});
canvas.addEventListener("webglcontextrestored", () => {
  try { intro = new FlashIntro(canvas, assets); intro.night = nightMix; mode = "idle"; notice.hidden = true; applySize(); draw(shownT); syncUi(); }
  catch (e) { showNotice("<strong>The intro couldn't restart.</strong> Reopen this page to try again."); }
});

async function boot() {
  setLook(savedLook(), false);
  syncUi();
  if (!window.WebGL2RenderingContext || !("DecompressionStream" in window)) {
    mode = "error";
    showNotice("<strong>This browser can't run the intro.</strong> It needs WebGL 2. Chrome on your Pixel has it, so open this page there.");
    return;
  }
  setupAudio();
  try {
    assets = await loadAssets();
    intro = new FlashIntro(canvas, assets);
    intro.night = nightMix;
    benchmark();
    mode = "idle";
    draw(POSTER_T);
    shutter.disabled = false;
    syncUi();
    window.__intro = { renderAt: (t) => { draw(t); intro.sync(); syncUi(); return true; }, get scale() { return scale; }, get hdr() { return intro.fmt.hdr; }, play,
      setLook: (n) => { setLook(!!n, false); return true; } };
    window.__ready = true;
  } catch (e) {
    mode = "error";
    const msg = String(e && e.message || e);
    if (msg === "no-webgl2") showNotice("<strong>This browser can't run the intro.</strong> It needs WebGL 2. Chrome on your Pixel has it, so open this page there.");
    else {
      const pre = document.createElement("pre");
      pre.textContent = msg.replace(/^shader-failed\n/, "");
      showNotice("<strong>The intro didn't start on this device.</strong> A screenshot of the details below helps fix it.<details><summary>Details</summary></details>");
      notice.querySelector("details").appendChild(pre);
    }
    window.__error = msg;
    syncUi();
  }
}
boot();
})();
</script>

</body>
