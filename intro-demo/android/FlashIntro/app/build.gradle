plugins {
    id 'com.android.application'
}

android {
    namespace 'com.brandon.flashintro'
    compileSdk 36

    defaultConfig {
        applicationId 'com.brandon.flashintro'
        minSdk 31
        targetSdk 36
        versionCode 2
        versionName '1.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// No dependencies: the intro uses only the Android platform (OpenGL ES 3.0, AudioTrack, the vibrator).
